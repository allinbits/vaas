name: E2E Forge

# The byzantine-consumer suite: a consumer that lies, and the provider's
# answer. A required check that judges only what it covers: the job runs on
# every push to main and on demand, and on a pull request only when the
# change touches the protocol, the apps, the harness or the forge; otherwise
# it is skipped, which the branch protection counts as passed.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Read the repository; read the pull request's changed files for the path
# filter.
permissions:
  contents: read
  pull-requests: read

# A newer push to the same PR supersedes its run. Every push to main has a
# group of its own, so none is cancelled or held back by another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Forge paths
    runs-on: ubuntu-latest
    outputs:
      forge: ${{ steps.filter.outputs.forge }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3 (v3.0.4)
        id: filter
        with:
          filters: |
            forge:
              - 'x/vaas/**'
              - 'app/**'
              - 'proto/**'
              - 'go.mod'
              - 'go.sum'
              - 'tests/e2e/**'
              - 'Makefile'
              - '.github/workflows/e2e-forge.yml'

  test-e2e-forge:
    name: Test E2E Forge
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.forge == 'true'
    runs-on: ubuntu-latest
    # go test bounds the suite at 60 minutes once the two images are built and
    # the relayer image pulled; this bounds the whole job.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test the forge
        run: cd tests/e2e/forge && go test ./...

      - name: Run the byzantine-consumer suite
        run: make test-e2e-forge
