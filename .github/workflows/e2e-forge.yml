name: E2E Forge

# The byzantine-consumer suite: a consumer that lies, and the provider's
# answer. It runs on demand, and on pull requests that touch the code whose
# answer it checks or the forge it wraps. Not a required check.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - x/vaas/consumer/module.go
      - x/vaas/consumer/keeper/downtime.go
      - x/vaas/consumer/keeper/evidence_packet.go
      - x/vaas/provider/module.go
      - x/vaas/provider/keeper/msg_server.go
      - x/vaas/provider/keeper/downtime.go
      - x/vaas/provider/keeper/downtime_challenge.go
      - x/vaas/provider/keeper/downtime_slash.go
      - x/vaas/provider/keeper/consumer_equivocation.go
      - x/vaas/provider/keeper/pending_equivocation.go
      - x/vaas/provider/keeper/consumer_lifecycle.go
      - x/vaas/provider/keeper/removal_vote.go
      - app/consumer/**
      - app/cmd/consumer/**
      - tests/e2e/forge/**
      - tests/e2e/e2e_forge_*
      - tests/e2e/base_suite_test.go
      - tests/e2e/four_validator_helpers_test.go
      - tests/e2e/docker/**
      - Makefile
      - .github/workflows/e2e-forge.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e-forge:
    name: Test E2E Forge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run the byzantine-consumer suite
        run: make test-e2e-forge
