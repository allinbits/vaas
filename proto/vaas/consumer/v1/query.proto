syntax = "proto3";

package vaas.consumer.v1;
import "vaas/v1/shared_consumer.proto";
option go_package = "github.com/allinbits/vaas/x/vaas/consumer/types";

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

// Query defines the gRPC query service of the VAAS consumer module.
service Query {
  // QueryParams queries the vaas/consumer module parameters.
  rpc QueryParams(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/vaas/consumer/params";
  }

  // QueryProviderInfo returns information about the provider chain connection.
  rpc QueryProviderInfo(QueryProviderInfoRequest)
      returns (QueryProviderInfoResponse) {
    option (google.api.http).get = "/vaas/consumer/provider-info";
  }
}

// QueryParamsRequest is the request type for the Query/QueryParams RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  vaas.v1.ConsumerParams params = 1 [ (gogoproto.nullable) = false ];
}

// QueryProviderInfoRequest is the request type for the Query/QueryProviderInfo
// RPC method.
message QueryProviderInfoRequest {}

// QueryProviderInfoResponse is the response type for the
// Query/QueryProviderInfo RPC method.
message QueryProviderInfoResponse {
  // consumer is the consumer's own chain id and the id of its IBC client
  // that tracks the provider.
  ChainInfo consumer = 1 [ (gogoproto.nullable) = false ];
  // provider is the provider's chain id as the state of that client reports
  // it; its client_id is not populated.
  ChainInfo provider = 2 [ (gogoproto.nullable) = false ];
}

// ChainInfo contains IBC connection information for a chain.
message ChainInfo {
  // chain_id is the chain id.
  string chain_id = 1;
  // client_id is the IBC client identifier.
  string client_id = 2;
}
